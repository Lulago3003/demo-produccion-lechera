# Gamma en un servidor, con Gemma. Guía completa: DESPLIEGUE.md
#   cp .env.example .env        # y completar la sección "Servidor"
#   docker compose --profile https up -d --build
name: gamma

services:
  ollama:
    image: ollama/ollama:0.40.13
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - modelos:/root/.ollama

  # Instala Gemma desde pesos/ (sin internet) o lo descarga, y lo deja cargado. Termina y se apaga.
  preparar:
    image: gamma-app
    build: .
    user: root
    command: ["python", "preparar_gemma.py"]
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODELS: /modelos/models
    volumes:
      - modelos:/modelos
      - ${GAMMA_PESOS_DIR:-./pesos}:/pesos:ro
    depends_on:
      - ollama
    restart: "no"

  gamma:
    image: gamma-app
    build: .
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://ollama:11434
      GAMMA_ORIGENES: ${GAMMA_ORIGENES:-}
      GAMMA_CLAVE: ${GAMMA_CLAVE:-}
    volumes:
      - registros:/app/.local
    ports:
      # Solo en el propio servidor; desde fuera se entra por HTTPS (perfil https) o por el proxy que ya tengan
      - "${GAMMA_ESCUCHA:-127.0.0.1}:${GAMMA_PUERTO:-8765}:8765"
    depends_on:
      preparar:
        condition: service_completed_successfully

  # HTTPS automático (Let's Encrypt) para GAMMA_DOMINIO. Se activa con --profile https.
  https:
    image: caddy:2.11.9-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      GAMMA_DOMINIO: ${GAMMA_DOMINIO:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./despliegue/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificados:/data
    depends_on:
      - gamma

volumes:
  modelos:
  registros:
  certificados:
